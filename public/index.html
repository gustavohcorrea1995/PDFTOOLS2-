<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDFTools</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <section id="hero">
      <div class="eyebrow">PDFTools</div>
      <h1>Ferramentas para PDF</h1>
      <p class="lead">Junte, divida, converta, comprima e edite seus PDFs.</p>
      <div id="toolGrid" class="tool-grid"></div>
    </section>

    <section id="workspace" class="hidden">
      <button id="backBtn" class="back">← Voltar</button>
      <h2 id="toolTitle"></h2>
      <div id="toolBody"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/app.js" defer></script>
</body>
</html>
