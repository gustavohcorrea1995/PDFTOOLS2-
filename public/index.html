<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDFTools</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <section id="hero">
      <div class="eyebrow">PDFTools</div>
      <h1>Ferramentas para PDF</h1>
      <p class="lead">Junte, divida, converta, comprima e edite seus PDFs.</p>
      <div id="toolGrid" class="tool-grid"></div>
    </section>
    <section id="workspace" class="hidden">
      <button id="backBtn" class="back">← Voltar</button>
      <h2 id="toolTitle"></h2>
      <div id="toolBody"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/coordinate-fix.js" defer></script>
  <script src="/preview-modal.js" defer></script>
  <script src="/progress-ui.js" defer></script>
  <script src="/editor-preview.js" defer></script>
  <script src="/app.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const applyEditorLabel = () => {
        const cards = document.querySelectorAll('.tool-card');
        cards.forEach(card => {
          const title = card.querySelector('h3');
          if (title && title.textContent.trim() === 'Adicionar texto/imagem') {
            title.textContent = 'Editar PDF';
            const desc = card.querySelector('p');
            if (desc) desc.textContent = 'Edite textos, imagens e elementos do seu PDF.';
          }
        });
        const workspaceTitle = document.getElementById('toolTitle');
        if (workspaceTitle && workspaceTitle.textContent.trim() === 'Adicionar texto/imagem') {
          workspaceTitle.textContent = 'Editar PDF';
        }
      };
      applyEditorLabel();
      new MutationObserver(applyEditorLabel).observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
